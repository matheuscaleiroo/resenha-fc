<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resenha FC">
<title>Resenha FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bowlby+One&family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Identidade 16-bit (estilo ISS / Super Nintendo) no jogo todo: o gramado é o fundo da página e
     cada tela fica numa "janela" com moldura grossa e sombra dura. Claro = jogo de dia (grama clara,
     janela creme); escuro = jogo à noite (grama escura, janela preta). Só os tokens mudam por tema. */
  :root {
    --grama1: #3d8a2c; --grama2: #4b9a37; --cal: rgba(255,255,255,.4);
    --painel: rgba(255,251,232,.97); --surface: #ffffff; --text: #142010; --muted: #56694c; --border: #cfc7a3;
    --moldura: #13230f; --accent: #c8200f; --accent-hover: #a3180a; --on-accent: #ffffff;
    --pitch1: #4b9a37; --pitch2: #3d8a2c; --bad: #c8200f; --warn: #9a5a00; --sombra: rgba(0,0,0,.4);
    --pixel: 'Press Start 2P', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --grama1: #1b4214; --grama2: #214d19; --cal: rgba(255,255,255,.22);
      --painel: rgba(5,12,5,.93); --surface: #13240f; --text: #f3f8ee; --muted: #a8c69b; --border: #36552d;
      --moldura: #e9f2e4; --accent: #ffe23a; --accent-hover: #fff07a; --on-accent: #1a1400;
      --pitch1: #1f5a1a; --pitch2: #1a4c16; --bad: #ff6b5a; --warn: #ffb347; --sombra: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --grama1: #1b4214; --grama2: #214d19; --cal: rgba(255,255,255,.22);
    --painel: rgba(5,12,5,.93); --surface: #13240f; --text: #f3f8ee; --muted: #a8c69b; --border: #36552d;
    --moldura: #e9f2e4; --accent: #ffe23a; --accent-hover: #fff07a; --on-accent: #1a1400;
    --pitch1: #1f5a1a; --pitch2: #1a4c16; --bad: #ff6b5a; --warn: #ffb347; --sombra: rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--grama1); }
  body { margin: 0; min-height: 100dvh; color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif;
    background: repeating-linear-gradient(90deg, var(--grama1) 0 64px, var(--grama2) 64px 128px) fixed; }
  /* linha do meio do campo atrás de tudo, e scanlines de TV por cima de tudo */
  body::before { content: ''; position: fixed; inset: 0 auto 0 50%; width: 3px; transform: translateX(-50%); background: var(--cal); pointer-events: none; }
  body::after { content: ''; position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px); }
  h1, h2, h3, .gols, .btn, .rodada, .selo { font-family: var(--pixel); font-weight: 400; letter-spacing: 0; }
  h2 { font-size: clamp(.85rem, 3.4vw, 1.15rem); line-height: 1.5; margin: .2em 0 .8em; }
  h3 { font-size: .8rem; line-height: 1.5; margin: 1.4em 0 .8em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto;
    padding: calc(68px + env(safe-area-inset-top)) 16px calc(52px + env(safe-area-inset-bottom)); }
  /* a janela de cada tela (o menu não: ele é a tela cheia em cima do gramado) */
  .tela { animation: entra .25s steps(4); }
  .tela:not(.tv) { background: var(--painel); border: 4px solid var(--moldura); box-shadow: 6px 6px 0 var(--sombra); padding: 22px 20px; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }
  .centro { text-align: center; padding-block: 40px !important; }
  .dica { color: var(--muted); font-size: .88rem; }
  /* palavra grande (nome de quem joga, "Hora da verdade", campeão, código da sala): mesma pintura da logo */
  .grande { margin: 0; font: clamp(2rem, 9vw, 3.6rem)/1.05 'Bowlby One', 'Arial Black', Impact, sans-serif; transform: skewX(-8deg);
    overflow-wrap: anywhere; color: transparent; -webkit-text-stroke: 1.5px #101a5c;
    background: linear-gradient(180deg, #fffbd0 0%, #ffe23a 38%, #ff9a00 62%, #e3260f 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(3px 3px 0 #101a5c); }

  .btn { background: var(--accent); color: var(--on-accent); border: 3px solid var(--moldura); border-radius: 0; padding: 13px 16px;
    font-size: .68rem; line-height: 1.5; box-shadow: 4px 4px 0 var(--sombra); text-align: center; }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--sombra); }
  .btn.sec { background: var(--surface); color: var(--text); }
  .btn.sec:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
  .btn[aria-pressed="true"]::before { content: '▶ '; }
  .acoes { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  .voltar { background: none; border: 0; color: var(--muted); padding: 0; margin-bottom: 12px; font: .62rem var(--pixel); }

  /* ---------- cantos fixos: configurações e versão ---------- */
  .canto-config { position: fixed; z-index: 40; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    width: 46px; height: 46px; display: grid; place-items: center; font-size: 1.35rem; line-height: 1;
    background: var(--painel); color: var(--text); border: 3px solid var(--moldura); box-shadow: 3px 3px 0 var(--sombra); }
  .canto-versao { position: fixed; z-index: 40; bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right));
    padding: 6px 8px; font: .55rem var(--pixel); color: #fff; background: rgba(5,12,5,.7); border: 2px solid rgba(255,255,255,.7); }
  .janela-fundo { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.55); }
  .janela { position: relative; width: min(100%, 520px); max-height: calc(100dvh - 32px); overflow: auto;
    background: var(--painel); border: 4px solid var(--moldura); box-shadow: 6px 6px 0 var(--sombra); padding: 22px 20px; }
  .janela .fechar { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; background: none; border: 0; font: .9rem var(--pixel); color: var(--muted); }
  .janela h2 { padding-right: 36px; }
  .janela .acoes .btn { flex: 1 1 auto; }
  .novidades { padding-left: 1.2em; margin: 0; display: grid; gap: 10px; }
  .nova-versao + .nova-versao { margin-top: 8px; padding-top: 4px; border-top: 3px dashed var(--border); }
  .nova-versao h3 small { font: .8rem Inter, sans-serif; color: var(--muted); }
  .nova-versao .marca { padding: 2px 6px; font: .45rem var(--pixel); vertical-align: 2px; background: var(--accent); color: var(--on-accent); }
  .bandeira { width: 1.45em; height: auto; aspect-ratio: 7 / 5; flex: none; vertical-align: -0.2em; shape-rendering: crispEdges;
    border: 2px solid #0b0f0b; box-shadow: 2px 2px 0 rgba(0,0,0,.45); background: #fff; }
  .menu-opcoes .op b { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .jogador.meu { opacity: 1; border-color: var(--accent); border-style: dashed; }
  .jogador.meu .nome::after { content: '  ✓ sua'; font: .5rem var(--pixel); color: var(--accent); }
  .novidades li::marker { content: '▶  '; color: var(--accent); font-size: .7em; }

  /* ---------- menu: tela de título, ocupando a tela toda ---------- */
  main:has(> .tv) { max-width: none; padding: 0; }
  .tv { position: relative; overflow: hidden; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    font-family: var(--pixel); color: #fff; text-align: center;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(52px + env(safe-area-inset-bottom)); }
  .tv::after { content: ''; position: absolute; left: 50%; top: 50%; width: min(46vw, 46vh, 420px); aspect-ratio: 1; transform: translate(-50%,-50%);
    border: 3px solid var(--cal); border-radius: 50%; pointer-events: none; }
  .tv > * { position: relative; z-index: 1; }
  .hud { align-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-right: 58px;
    font-size: clamp(.6rem, 1.6vw, .85rem); text-shadow: 2px 2px 0 #0a2a0a; }
  .hud-placar { display: flex; align-items: center; gap: 8px; }
  .hud-placar img { width: clamp(28px, 4vw, 42px); height: clamp(28px, 4vw, 42px); object-fit: contain; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.5)); }
  .hud-tempo { background: rgba(10,20,60,.75); border: 2px solid #c9d4ff; padding: 6px 8px; }
  .logo-retro { margin: auto 0 0; line-height: .9; font-family: 'Bowlby One', 'Arial Black', Impact, sans-serif; font-weight: 400;
    letter-spacing: .01em; transform: skewX(-8deg); }
  .logo-retro span { display: block; color: transparent; -webkit-text-stroke: 2px #101a5c;
    background: linear-gradient(180deg, #fffbd0 0%, #ffe23a 38%, #ff9a00 62%, #e3260f 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(5px 5px 0 #101a5c); }
  .logo-retro .l1 { font-size: clamp(2.8rem, 13vw, 8rem); }
  .logo-retro .l2 { font-size: clamp(3.4rem, 18vw, 10.5rem); }
  .pisca { margin: 26px 0 18px; font-size: clamp(.7rem, 1.6vw, .95rem); color: #ffe23a; text-shadow: 2px 2px 0 #3a1a00; animation: pisca 1.1s steps(2) infinite; }
  @keyframes pisca { 50% { opacity: 0; } }
  .menu-opcoes { display: flex; justify-content: center; gap: clamp(8px, 2vw, 20px); width: min(100%, 900px); }
  .menu-opcoes .op, .modo { position: relative; min-width: 0; flex: 1 1 0; padding: 18px 14px 16px 32px; text-align: left;
    background: rgba(5,12,5,.8); border: 3px solid #e9f2e4; box-shadow: 5px 5px 0 rgba(0,0,0,.45);
    font-family: var(--pixel); color: #fff; display: grid; align-content: start; gap: 10px; }
  .menu-opcoes .op b { font-weight: 400; font-size: clamp(.68rem, 1.9vw, 1.25rem); text-shadow: 2px 2px 0 #000; }
  .menu-opcoes .op small { font-size: clamp(.45rem, 1.05vw, .65rem); line-height: 1.7; color: #b9d8ad; }
  .menu-opcoes .op::before { content: '▶'; position: absolute; left: 10px; top: 20px; font-size: clamp(.6rem, 1.4vw, .9rem); color: #ffe23a; visibility: hidden; }
  .menu-opcoes .op.ativo { border-color: #ffe23a; }
  .menu-opcoes .op.ativo b { color: #ffe23a; }
  .menu-opcoes .op.ativo::before { visibility: visible; animation: pisca .8s steps(2) infinite; }
  .menu-opcoes .op:disabled { opacity: .55; border-style: dashed; }
  .menu-opcoes .op:focus-visible { outline: 3px solid #ffe23a; outline-offset: 3px; }
  .link-novidades { margin-top: 22px; background: none; border: 0; padding: 8px; font: clamp(.55rem, 1.2vw, .75rem) var(--pixel); color: #fff;
    text-shadow: 2px 2px 0 #0a2a0a; text-decoration: underline; text-underline-offset: 5px; }
  .copy { margin: auto 0 0; padding-top: 22px; font-size: clamp(.5rem, 1.1vw, .65rem); line-height: 1.9; text-shadow: 2px 2px 0 #0a2a0a; }
  @media (max-width: 480px) {   /* continua em linha no celular: só encolhe */
    .menu-opcoes .op { padding: 13px 6px 11px 18px; }
    .menu-opcoes .op::before { left: 5px; top: 14px; }
    .hud { padding-right: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { .pisca, .menu-opcoes .op.ativo::before { animation: none; } }

  /* menu do online: as mesmas caixas do menu principal, dentro da janela */
  .modos { display: flex; flex-wrap: wrap; gap: 14px; }
  .modo { flex: 1 1 240px; padding-left: 16px; }
  .modo:hover { border-color: #ffe23a; }
  .modo h2 { margin: 0; font-size: .95rem; color: #ffe23a; text-shadow: 2px 2px 0 #000; }
  .modo p { margin: 0; font: .9rem/1.5 Inter, sans-serif; color: #d6ead0; }
  .selo { font-size: .55rem; color: var(--muted); }

  .nomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
  input, select { font: inherit; padding: 11px 12px; border-radius: 0; border: 3px solid var(--moldura); background: var(--surface); color: var(--text); }
  .rodada { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .6rem; line-height: 1.6; padding-right: 48px; }

  .roleta { position: relative; overflow: hidden; margin: 16px 0; padding: 14px 0; border: 4px solid var(--moldura); background: var(--pitch2); }
  .roleta::before, .roleta::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; border: 10px solid transparent; }
  .roleta::before { top: 0; border-top-color: #ffe23a; }
  .roleta::after { bottom: 0; border-bottom-color: #ffe23a; }
  .marcador { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: #ffe23a; z-index: 2; transform: translateX(-50%); }
  .faixa { position: relative; display: flex; gap: 12px; padding: 0 12px; will-change: transform; }
  .clube { flex: 0 0 104px; text-align: center; font: .5rem/1.6 var(--pixel); color: #fff; text-shadow: 1px 1px 0 #000; }
  .escudo { height: 104px; margin-bottom: 6px; display: grid; place-items: center; background: #f4f1e0;
    border: 3px solid #13230f; border-bottom: 8px solid; transition: transform .3s; }
  .escudo img { width: 72px; height: 72px; object-fit: contain; }
  .mini { width: 1.3em; height: 1.3em; object-fit: contain; vertical-align: -0.3em; padding: 1px; background: #f4f1e0; border-radius: 3px; }
  .formacoes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .vencedor .escudo { transform: scale(1.08); box-shadow: 0 0 0 4px #ffe23a; }
  .resultado { text-align: center; font-size: 1.1rem; min-height: 2em; }

  .escolha { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .escolha { grid-template-columns: 1fr; } }
  .lista { display: grid; gap: 6px; }
  .jogador { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 3px solid var(--border); padding: 9px 12px; }
  .jogador:hover:not(:disabled) { border-color: var(--moldura); }
  .jogador.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .jogador .nome { font-weight: 600; }
  .jogador .pos, .chip .pos { font: .5rem/1.6 var(--pixel); color: var(--accent); }
  .jogador .ovr { font: .85rem var(--pixel); }

  .placa { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; }
  .placa h3 { margin: 0; }
  .placa span { font-size: .8rem; color: var(--muted); }
  .campo { display: grid; gap: 8px; padding: 14px 8px; border: 4px solid var(--moldura);
    background: repeating-linear-gradient(180deg, var(--pitch1) 0 44px, var(--pitch2) 44px 88px); }
  .linha { display: flex; justify-content: center; gap: 6px; }
  .chip { flex: 0 1 92px; min-width: 0; background: var(--surface); border: 2px solid var(--moldura); padding: 5px 6px; text-align: center;
    box-shadow: 2px 2px 0 var(--sombra); }
  .chip b { display: block; font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .meta { font-size: .68rem; color: var(--muted); }
  .chip.vazio { opacity: .6; border-style: dashed; box-shadow: none; }
  .banco { display: flex; justify-content: center; margin-top: 10px; }

  .times { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin: 16px 0; }
  .alerta { border: 3px solid var(--bad); padding: 12px 16px; }
  .alerta h3 { margin: 0 0 6px; color: var(--bad); }
  .alerta li b { text-decoration: line-through; }

  .placar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center;
    background: rgba(10,20,60,.92); color: #fff; border: 4px solid #c9d4ff; padding: 20px 12px; box-shadow: 4px 4px 0 var(--sombra); }
  .lado { font-weight: 800; overflow-wrap: anywhere; }
  .lado small, .gols small { display: block; font: 400 .78rem Inter, sans-serif; color: #c9d4ff; }
  .gols { font-size: clamp(1.4rem, 6vw, 2.4rem); line-height: 1.2; white-space: nowrap; }
  .gols small { margin-top: 6px; font: .55rem var(--pixel); }
  .lances { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 6px; }
  .lances li { background: var(--surface); border: 2px solid var(--border); padding: 8px 12px; animation: entra .3s steps(3); }
  .lances small { color: var(--muted); }
  .lances .pen { border-color: var(--accent); font-weight: 800; }

  .participantes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 12px 0; }
  .participante { display: flex; align-items: center; gap: 8px; }
  .participante input { flex: 1; min-width: 0; }
  .icone-x { background: none; border: 0; color: var(--muted); width: 36px; height: 36px; }
  .opcoes { display: grid; gap: 10px; margin-bottom: 24px; }
  .opcoes label, .turbo { display: flex; align-items: center; gap: 8px; }
  .opcoes input, .turbo input { width: 20px; height: 20px; accent-color: var(--accent); }
  .opcoes small { color: var(--muted); }
  .turbo { justify-content: center; margin-top: 10px; font-size: .9rem; color: var(--muted); }

  .chip.fora { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, var(--surface)); }
  .chip.fora .pos, .tag-fora { color: var(--warn); font-weight: 800; }
  .chip s { color: var(--muted); }

  .banco-cobre { margin: 4px 0 12px; }
  .cobre-opcoes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip-cobre { display: grid; grid-template-columns: auto auto; align-items: center; gap: 4px 10px; background: var(--surface); border: 3px solid var(--border);
    padding: 8px 12px; text-align: left; }
  .chip-cobre small { grid-column: 1 / -1; font-size: .7rem; color: var(--muted); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banco-cobre h3 { margin: 18px 0 8px; }
  .banco-cobre h3 small { font-family: Inter, sans-serif; }
  .chip-cobre .pos { font: .5rem var(--pixel); color: var(--muted); }
  .chip-cobre b { font: .8rem var(--pixel); }
  .chip-cobre.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .chip-cobre.sel .pos { color: var(--accent); }

  .taticas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .tatica-op { text-align: left; background: var(--surface); border: 3px solid var(--border); padding: 16px; display: grid; gap: 6px; }
  .tatica-op:hover { border-color: var(--moldura); }
  .tatica-op.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow: 4px 4px 0 var(--sombra); }
  .tatica-icone { font-size: 1.6rem; }
  .tatica-op b { font: .75rem/1.6 var(--pixel); }
  .tatica-op .marca { margin-left: 6px; padding: 2px 6px; font: .45rem var(--pixel); vertical-align: 2px; background: var(--accent); color: var(--on-accent); }
  .tatica-op small { color: var(--muted); }

  .espera-lista { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 6px; max-width: 360px; margin-inline: auto; }
  .espera-lista li { background: var(--surface); border: 2px solid var(--border); padding: 8px 14px; text-align: left; }

  .bonus { color: var(--warn); font-weight: 800; }
  details.dica { margin-bottom: 8px; }
  details.dica summary { cursor: pointer; }
  .centralizado { justify-content: center; }
  .misterio { width: 130px; height: 130px; margin: 0 auto 20px; display: grid; place-items: center; border: 4px solid var(--moldura);
    background: var(--accent); color: var(--on-accent); font: 4rem/1 var(--pixel); box-shadow: 5px 5px 0 var(--sombra); animation: pulsa 1.4s steps(4) infinite; }
  @keyframes pulsa { 50% { transform: scale(1.08) rotate(-6deg); } }
  /* plaquinha clara atrás do escudo: os escuros (Tottenham, Corinthians, Vasco...) somem no tema Noite */
  .escudo-grande { width: 112px; height: 112px; object-fit: contain; padding: 10px; background: #f4f1e0; border: 3px solid #13230f; box-shadow: 4px 4px 0 var(--sombra); }
  .cartas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0; }
  .carta { position: relative; width: 150px; padding: 14px 10px; background: var(--surface); border: 3px solid var(--moldura); box-shadow: 4px 4px 0 var(--sombra);
    display: grid; gap: 4px; opacity: 0; animation: vira .5s ease forwards; }
  .carta small { color: var(--muted); font-weight: 600; }
  .carta span { font-size: .8rem; color: var(--muted); }
  .carta.repetido { border-color: var(--bad); }
  .carta em { position: absolute; inset: auto 0 -12px; margin: auto; width: max-content; padding: 4px 8px; font: .5rem var(--pixel);
    background: var(--bad); color: #fff; border: 2px solid #000; opacity: 0; animation: carimbo .3s ease forwards; }
  .veredito { font: .7rem/1.6 var(--pixel); opacity: 0; animation: vira .4s ease forwards; }
  @keyframes vira { from { opacity: 0; transform: rotateY(90deg); } to { opacity: 1; transform: none; } }
  @keyframes carimbo { from { opacity: 0; transform: scale(2); } to { opacity: 1; transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) {
    .tela, .lances li, .misterio, .carta, .carta em, .veredito { animation: none; opacity: 1; }
  }

  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; }
  th { font: .5rem var(--pixel); color: var(--muted); }
  th, td { padding: 9px 6px; text-align: center; border-bottom: 2px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  .campeao { text-align: center; padding: 12px 0 24px; }
  .trofeu { font-size: 3.4rem; line-height: 1; margin-bottom: 8px; }

  @media (max-width: 480px) {
    main { padding-inline: 10px; }
    .tela:not(.tv) { padding: 18px 14px; border-width: 3px; box-shadow: 4px 4px 0 var(--sombra); }
    .btn { font-size: .6rem; padding: 12px 12px; }
    .chip { padding: 4px 3px; }
    .chip b { font-size: .7rem; }
    .linha { gap: 4px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<button class="canto-config" onclick="abrirConfig()" aria-label="Configurações">⚙</button>
<button class="canto-versao" id="versao" onclick="abrirNovidades()" aria-label="Ver novidades desta versão"></button>
<script>
  // Versão do jogo: único lugar onde ela é escrita. Aparece no canto da tela e vai no ?v= de cada
  // script — sem isso o navegador reaproveita o .js velho do cache por até 10 min (GitHub Pages manda
  // max-age=600) mesmo com este index.html novo. test.js confere que bate com o topo do CHANGELOG.md.
  const VERSAO = '1.5.0';
  try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
  ['data.js', 'data-big6.js', 'logic.js', 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
   'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js', 'firebase-config.js', 'online.js', 'app.js']
    .forEach(src => {
      const s = document.createElement('script');
      s.src = src.startsWith('http') ? src : `${src}?v=${VERSAO}`;
      s.async = false;   // scripts inseridos assim rodam na ordem da lista
      document.body.appendChild(s);
    });
</script>
</body>
</html>
