<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resenha FC">
<title>Resenha FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1E7; --surface: #FFFCF6; --text: #2A1619; --muted: #7B6A6B; --border: #E4D8C8;
    --accent: #7A1F2E; --accent-hover: #5E1522; --on-accent: #FBF7EF;
    --pitch1: #EFE6D7; --pitch2: #E8DDCB; --bad: #B3261E; --warn: #A15C00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1113; --surface: #251719; --text: #F3ECE1; --muted: #B4A39F; --border: #3D2A2D;
      --accent: #B23A4E; --accent-hover: #C94D62; --on-accent: #FFF8F0;
      --pitch1: #2A1B1E; --pitch2: #24171A; --bad: #F2867D; --warn: #F0B458;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1113; --surface: #251719; --text: #F3ECE1; --muted: #B4A39F; --border: #3D2A2D;
    --accent: #B23A4E; --accent-hover: #C94D62; --on-accent: #FFF8F0;
    --pitch1: #2A1B1E; --pitch2: #24171A; --bad: #F2867D; --warn: #F0B458;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 Inter, system-ui, sans-serif; }
  h1, h2, h3, .logo, .gols, .grande { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: .02em; font-weight: 400; }
  h2 { font-size: 2rem; margin: .2em 0 .4em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background: var(--accent); color: var(--on-accent); }
  .logo { background: none; border: 0; color: inherit; font-size: 1.8rem; padding: 0; }
  .icone { background: none; border: 1px solid currentColor; border-radius: 999px; width: 40px; height: 40px; color: inherit; font-size: 1.1rem; }

  main { max-width: 960px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .tela { animation: entra .25s ease; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
  .centro { text-align: center; padding-top: 8vh; }
  .grande { font-size: clamp(3rem, 12vw, 5rem); margin: 0; color: var(--accent); }
  .dica { color: var(--muted); font-size: .9rem; }
  .titulo { font-size: 2.6rem; margin: 8px 0 16px; }

  .btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 800; }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.sec { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .voltar { background: none; border: 0; color: var(--muted); padding: 0; margin-bottom: 8px; }

  .modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .modo { text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 20px; }
  .modo:not(.off):hover { border-color: var(--accent); }
  .modo h2 { font-size: 3rem; margin: 6px 0; color: var(--accent); }
  .modo p { margin: 0; color: var(--muted); }
  .modo.off { opacity: .55; border-style: dashed; }
  .selo { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .contador { display: flex; align-items: center; gap: 16px; margin: 12px 0; }
  .contador .btn { width: 48px; padding: 10px 0; }
  .nomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .nomes input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); }

  .rodada { display: flex; justify-content: space-between; font-weight: 800; color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }

  .roleta { position: relative; overflow: hidden; margin: 16px 0; padding: 14px 0; border: 2px solid var(--accent); border-radius: 16px; background: var(--surface); }
  .roleta::before, .roleta::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; border: 10px solid transparent; }
  .roleta::before { top: 0; border-top-color: var(--accent); }
  .roleta::after { bottom: 0; border-bottom-color: var(--accent); }
  .marcador { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; transform: translateX(-50%); }
  .faixa { position: relative; display: flex; gap: 12px; padding: 0 12px; will-change: transform; }
  .clube { flex: 0 0 104px; text-align: center; font-size: .8rem; font-weight: 600; }
  .escudo { height: 104px; border-radius: 12px; display: grid; place-items: center; background: var(--bg);
    border: 1px solid var(--border); border-bottom: 6px solid; transition: transform .3s; }
  .escudo img { width: 72px; height: 72px; object-fit: contain; }
  .mini { width: 1.2em; height: 1.2em; object-fit: contain; vertical-align: -0.25em; }
  .formacoes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .vencedor .escudo { transform: scale(1.08); box-shadow: 0 0 0 4px var(--accent); }
  .resultado { text-align: center; font-size: 1.3rem; min-height: 2em; }

  .escolha { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .escolha { grid-template-columns: 1fr; } }
  .lista { display: grid; gap: 6px; }
  .jogador { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .jogador.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .jogador .pos, .chip .pos { font-size: .7rem; font-weight: 800; color: var(--accent); }
  .jogador .ovr { font: 1.4rem 'Bebas Neue', Impact, sans-serif; }

  .placa { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .placa h3 { font-size: 1.6rem; margin: 0; }
  .placa span { font-size: .8rem; color: var(--muted); }
  .campo { display: grid; gap: 8px; padding: 12px 8px; border-radius: 14px; border: 2px solid var(--border);
    background: repeating-linear-gradient(180deg, var(--pitch1) 0 44px, var(--pitch2) 44px 88px); }
  .linha { display: flex; justify-content: center; gap: 6px; }
  .chip { flex: 0 1 90px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; text-align: center; }
  .chip b { display: block; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .meta { font-size: .68rem; color: var(--muted); }
  .chip.vazio { opacity: .5; border-style: dashed; }
  .banco { display: flex; justify-content: center; margin-top: 8px; }

  .times { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 16px 0; }
  .alerta { border: 2px solid var(--bad); border-radius: 14px; padding: 12px 16px; }
  .alerta h3 { margin: 0; color: var(--bad); font-size: 1.4rem; }
  .alerta li b { text-decoration: line-through; }

  .placar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center;
    background: var(--surface); border: 2px solid var(--accent); border-radius: 18px; padding: 20px 12px; }
  .lado { font-weight: 800; overflow-wrap: anywhere; }
  .lado small, .gols small { display: block; font: 400 .8rem Inter, sans-serif; color: var(--muted); }
  .gols { font-size: 3.4rem; line-height: 1; }
  .lances { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 6px; }
  .lances li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; animation: entra .3s ease; }
  .lances small { color: var(--muted); }
  .lances .pen { border-color: var(--accent); font-weight: 800; }


  .participantes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 12px 0; }
  .participante { display: flex; align-items: center; gap: 8px; }
  .participante input { flex: 1; min-width: 0; }
  .participante input, .participante select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); }
  .icone-x { background: none; border: 0; color: var(--muted); width: 36px; height: 36px; border-radius: 999px; }
  .opcoes { display: grid; gap: 10px; margin-bottom: 24px; }
  .opcoes label, .turbo { display: flex; align-items: center; gap: 8px; }
  .opcoes input, .turbo input { width: 20px; height: 20px; accent-color: var(--accent); }
  .opcoes small { color: var(--muted); }
  .turbo { justify-content: center; margin-top: 10px; font-size: .9rem; color: var(--muted); }

  .chip.fora { border: 2px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
  .chip.fora .pos, .tag-fora { color: var(--warn); font-weight: 800; }
  .chip s { color: var(--muted); }

  .banco-cobre { margin: 4px 0 12px; }
  .cobre-opcoes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip-cobre { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--border);
    border-radius: 10px; padding: 8px 12px; }
  .chip-cobre .pos { font-size: .75rem; font-weight: 800; color: var(--muted); }
  .chip-cobre b { font: 1.2rem 'Bebas Neue', Impact, sans-serif; }
  .chip-cobre.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .chip-cobre.sel .pos { color: var(--accent); }

  .taticas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .tatica-op { text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 16px; display: grid; gap: 4px; }
  .tatica-op:hover { border-color: var(--accent); }
  .tatica-op.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .tatica-icone { font-size: 1.6rem; }
  .tatica-op b { font-size: 1.1rem; }
  .tatica-op small { color: var(--muted); }

  .espera-lista { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 6px; max-width: 360px; margin-inline: auto; }
  .espera-lista li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; text-align: left; }

  .bonus { color: var(--warn); font-weight: 800; }
  details.dica { margin-bottom: 8px; }
  .centralizado { justify-content: center; }
  .misterio { width: 140px; height: 140px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font: 6rem/1 'Bebas Neue', Impact, sans-serif; animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 50% { transform: scale(1.08) rotate(-6deg); box-shadow: 0 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); } }
  .escudo-grande { width: 96px; height: 96px; object-fit: contain; }
  .cartas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0; }
  .carta { position: relative; width: 150px; padding: 14px 10px; border-radius: 14px; background: var(--surface); border: 2px solid var(--border);
    display: grid; gap: 2px; opacity: 0; animation: vira .5s ease forwards; }
  .carta small { color: var(--muted); font-weight: 600; }
  .carta span { font-size: .8rem; color: var(--muted); }
  .carta.repetido { border-color: var(--bad); }
  .carta em { position: absolute; inset: auto 0 -10px; margin: auto; width: max-content; padding: 2px 8px; border-radius: 6px; font-style: normal;
    font-weight: 800; font-size: .75rem; background: var(--bad); color: var(--surface); opacity: 0; animation: carimbo .3s ease forwards; }
  .veredito { font-weight: 800; opacity: 0; animation: vira .4s ease forwards; }
  @keyframes vira { from { opacity: 0; transform: rotateY(90deg); } to { opacity: 1; transform: none; } }
  @keyframes carimbo { from { opacity: 0; transform: scale(2); } to { opacity: 1; transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) {
    .misterio, .carta, .carta em, .veredito { animation: none; opacity: 1; }
  }

  table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  .campeao { text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<header>
  <button class="logo" onclick="telaMenu()">Resenha FC</button>
  <button class="icone" onclick="alternarTema()" aria-label="Alternar tema claro/escuro">◐</button>
</header>
<main id="app"></main>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="online.js"></script>
<script src="app.js"></script>
</body>
</html>
